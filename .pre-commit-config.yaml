# Hooks that guard every commit.
#
# Install them once, after `poetry install --with dev`:
#
#     poetry run pre-commit install
#
# The test suite is not a hook: it runs in CI on every push (see ci.yml),
# which also runs this file, so a clean commit here is a green lint job there.

repos:
  # --- 1. Prevent commits to main ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main]

  # --- 2. Strip notebook outputs ---
  # Tutorials are committed as source, not as a record of one run. Outputs are
  # megabytes of base64 images and run-dependent numbers that make every diff
  # unreadable and every re-execution a spurious change. nbstripout also
  # renumbers cell ids, so simply opening a notebook stops dirtying the tree.
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout

  # --- 3. Run Ruff (Linting & Formatting) ---
  # `rev` tracks the ruff version in pyproject.toml's dev group so that the hook
  # and `poetry run ruff` format identically. Bump the two together, never one
  # alone: a mismatch reformats files back and forth between commits.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
