[project]
name = "pygeoinf"
version = "1.8.9"
description = "A package for solving geophysical inference and inverse problems"
# NOTE: poetry-core renders only authors[0] into the distribution metadata
# (Package._get_author), so the names are kept as one combined credit line to
# avoid dropping co-authors from the published package.
authors = [{ name = "David Al-Attar, Dan Heathcote, Adrian Mag" }]
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.13.0",
    "matplotlib>=3.9.0",
    "joblib>=1.5.3",
    "threadpoolctl>=3.6.0",
    "finufft>=2.5.1",
]

[project.optional-dependencies]
# Function spaces on the two-sphere: spherical harmonics plus geospatial plotting.
sphere = ["pyshtools>=4.14.1", "Cartopy>=0.25.0", "shapely>=2.0.0"]
# Alternative QP backends for the convex-analysis solvers.
osqp = ["osqp>=1.0.0"]
clarabel = ["clarabel>=0.9.0"]
# Interactive (Plotly) plotting backend.
interactive = ["plotly>=5.0.0"]

[tool.poetry]
packages = [{ include = "pygeoinf" }]
include = [{ path = "pygeoinf/data/*.csv", format = ["sdist", "wheel"] }]

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pytest-cov = "^6.2.1"
snakeviz = "^2.2.2"
jupyter = "^1.1.1"
furo = "^2025.7.19"
sphinx = "<8.2"
nbsphinx = "^0.9.7"
ruff = "^0.5.5"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"


# --- Added Ruff Configuration ---
[tool.ruff]
exclude = ["work"]

[tool.ruff.lint.per-file-ignores]
# Tutorials use a Colab bootstrap pattern: setup_env() is loaded via exec() before
# imports, making F821 (undefined setup_env) and E402 (imports after exec) false
# positives. F401 is suppressed because notebook cells share scope across execution.
"tutorials/*.ipynb" = ["E402", "F821", "F401", "F541", "E731"]

# For any file in the "tests/" directory, ignore the lambda assignment warning (E731).
"tests/*" = ["E731", "E741"]

# test_subsets.py has matplotlib imports mid-file due to backend setup (matplotlib.use("Agg"))
"tests/test_subsets.py" = ["E731", "E741", "E402"]

# convex_optimisation.py uses `l` as the standard QP lower-bound parameter name (OSQP convention)
"pygeoinf/convex_optimisation.py" = ["E741"]

# For the sphere.py file, where 'l' is a common variable name for spherical
# harmonic degree, ignore the ambiguous variable name warning (E741).
"pygeoinf/symmetric_space/sphere.py" = ["E741"]
"pygeoinf/symmetric_space/sh_tools.py" = ["E741"]
"pygeoinf/symmetric_space/wigner.py" = ["E741"]
"pygeoinf/symmetric_space_new/sphere.py" = ["E741"]
"pygeoinf/symmetric_space_new/sh_tools.py" = ["E741"]
"pygeoinf/rough_work/*" = ["E741"]
