[project]
name = "pygeoinf"
version = "1.8.9"
description = "A package for solving geophysical inference and inverse problems"
# NOTE: poetry-core renders only authors[0] into the distribution metadata
# (Package._get_author), so the names are kept as one combined credit line to
# avoid dropping co-authors from the published package.
authors = [{ name = "David Al-Attar, Dan Heathcote, Adrian Mag" }]
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.13.0",
    "matplotlib>=3.9.0",
    "joblib>=1.5.3",
    "threadpoolctl>=3.6.0",
    "finufft>=2.5.1",
]

[project.optional-dependencies]
# Function spaces on the two-sphere: spherical harmonics plus geospatial plotting.
# ducc0 is the fast transform backend; pyshtools selects it by default when it
# is importable, so nothing in the code refers to it.
sphere = ["pyshtools>=4.14.1", "ducc0>=0.15", "Cartopy>=0.25.0", "shapely>=2.0.0"]
# Spaces on intervals, radial profiles, annuli and balls in the eigenbasis of
# an elliptic operator on a spectral-element mesh (pygeoinf2.interval,
# pygeoinf2.ball and the pygeoinf2.spectral_element core they share):
# the numerics are planetmodel.randomfield's. From 1.3 planetmodel's
# harmonics run on ducc0 as a core dependency, so there is no extra to name
# and pyshtools no longer arrives through it; drawing a ball's shells as
# maps still goes through the sphere renderer, which is the sphere extra.
planetmodel = ["planetmodel>=1.3"]
# Alternative QP backends for the convex-analysis solvers.
osqp = ["osqp>=1.0.0"]
clarabel = ["clarabel>=0.9.0"]
# Interactive (Plotly) plotting backend.
interactive = ["plotly>=5.0.0"]
# The plotly engine of pygeoinf2's plot_set: three-dimensional sets as figures
# that can be turned by hand.
plot3d = ["plotly>=5.18,<7"]
# PyMFEM, for the MFEM mini-app (pygeoinf2/miniapps/mfem) and its test, which
# skips without it; the library itself does not use it. mfem ships Linux-only
# wheels and its sdist refuses to build on Windows, so the extra is marked for
# Linux; elsewhere `--all-extras` installs nothing and the test skips.
mfem = ["mfem>=4.8.0; sys_platform == 'linux'"]

[tool.poetry]
packages = [
    { include = "pygeoinf2" },
]
include = [
    { path = "pygeoinf2/data/*.csv", format = ["sdist", "wheel"] },
    { path = "pygeoinf2/py.typed", format = ["sdist", "wheel"] },
]
# Tests are run from the repository, not from an installed wheel.
exclude = [
    "pygeoinf2/tests",
]

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pytest-cov = "^6.2.1"
snakeviz = "^2.2.2"
jupyter = "^1.1.1"
furo = "^2025.7.19"
# Lower bound: the apidoc template in docs/apidoc_templates is named
# package.rst.jinja, which is the name Sphinx looks for from 7.4 onwards
# (it was package.rst_t before).
sphinx = ">=7.4"
# Keep in step with the `rev` of the ruff hook in .pre-commit-config.yaml, so
# that the hook and `poetry run ruff` format identically.
ruff = "^0.5.5"
pre-commit = "^4.6.2"
# Strips outputs and normalises cell ids in the tutorial notebooks. Driven by
# pre-commit; listed here so it can also be run by hand on a single notebook.
nbstripout = "^0.9.1"
nanobind = ">=2.4"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"


# --- Added Ruff Configuration ---
[tool.ruff]
exclude = ["work"]

[tool.ruff.lint.per-file-ignores]
# In a "tests/" directory, ignore the lambda assignment warning (E731) and
# the ambiguous-name warning (E741).
"**/tests/*" = ["E731", "E741"]

[tool.pytest.ini_options]
# The default run excludes `slow`. Those tests are not less important — several
# are the parity checks the design record leans on — but they are the ones
# whose cost is the *point* (an iteration count on a badly-scaled problem, a
# Monte Carlo estimate against its own standard error), so they are worth
# minutes rather than seconds and are worth them occasionally.
#
#     pytest pygeoinf2                 the fast suite
#     pytest pygeoinf2 -m slow         only the expensive ones
#     pytest pygeoinf2 -m ""           everything
#
# CI runs the fast suite on every push and the slow set on a schedule. The
# suite caps the BLAS and OpenMP pools at two threads (PYGEOINF2_TEST_THREADS
# overrides; see pygeoinf2/tests/conftest.py), so a run never swamps the
# machine and no test depends on the core count.
addopts = "-m 'not slow'"
markers = [
    "slow: takes tens of seconds or more; excluded from the default run",
]
