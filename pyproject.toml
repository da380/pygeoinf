[project]
name = "pygeoinf"
version = "1.8.9"
description = "A package for solving geophysical inference and inverse problems"
# NOTE: poetry-core renders only authors[0] into the distribution metadata
# (Package._get_author), so the names are kept as one combined credit line to
# avoid dropping co-authors from the published package.
authors = [{ name = "David Al-Attar, Dan Heathcote, Adrian Mag" }]
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.13.0",
    "matplotlib>=3.9.0",
    "joblib>=1.5.3",
    "threadpoolctl>=3.6.0",
    "finufft>=2.5.1",
]

[project.optional-dependencies]
# Function spaces on the two-sphere: spherical harmonics plus geospatial plotting.
sphere = ["pyshtools>=4.14.1", "Cartopy>=0.25.0", "shapely>=2.0.0"]
# Alternative QP backends for the convex-analysis solvers.
osqp = ["osqp>=1.0.0"]
clarabel = ["clarabel>=0.9.0"]
# Interactive (Plotly) plotting backend.
interactive = ["plotly>=5.0.0"]
# Foreign vector and matrix backends, adapted in pygeoinf2.backends. Used only
# by the examples and their tests, which skip when they are absent.
mfem = ["mfem>=4.8.0"]

[tool.poetry]
# Both packages ship for the dev period: pygeoinf2 is the 2.0 refactor and is
# not yet the one imported by default, but its data files were already listed
# below and without it in `packages` they would have gone into a wheel that
# does not contain the package they belong to.
packages = [
    { include = "pygeoinf" },
    { include = "pygeoinf2" },
]
include = [
    { path = "pygeoinf/data/*.csv", format = ["sdist", "wheel"] },
    { path = "pygeoinf2/data/*.csv", format = ["sdist", "wheel"] },
    { path = "pygeoinf/py.typed", format = ["sdist", "wheel"] },
    { path = "pygeoinf2/py.typed", format = ["sdist", "wheel"] },
]
# Tests are run from the repository, not from an installed wheel.
exclude = [
    "pygeoinf/tests",
    "pygeoinf2/tests",
]

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pytest-cov = "^6.2.1"
snakeviz = "^2.2.2"
jupyter = "^1.1.1"
furo = "^2025.7.19"
sphinx = "<8.2"
nbsphinx = "^0.9.7"
ruff = "^0.5.5"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"


# --- Added Ruff Configuration ---
[tool.ruff]
exclude = ["work"]

[tool.ruff.lint.per-file-ignores]
# Tutorials use a Colab bootstrap pattern: setup_env() is loaded via exec() before
# imports, making F821 (undefined setup_env) and E402 (imports after exec) false
# positives. F401 is suppressed because notebook cells share scope across execution.
"tutorials/*.ipynb" = ["E402", "F821", "F401", "F541", "E731"]

# For any file in the "tests/" directory, ignore the lambda assignment warning (E731).
"tests/*" = ["E731", "E741"]

# test_subsets.py has matplotlib imports mid-file due to backend setup (matplotlib.use("Agg"))
"tests/test_subsets.py" = ["E731", "E741", "E402"]

# convex_optimisation.py uses `l` as the standard QP lower-bound parameter name (OSQP convention)
"pygeoinf/convex_optimisation.py" = ["E741"]

# For the sphere.py file, where 'l' is a common variable name for spherical
# harmonic degree, ignore the ambiguous variable name warning (E741).
"pygeoinf/symmetric_space/sphere.py" = ["E741"]
"pygeoinf/symmetric_space/sh_tools.py" = ["E741"]
"pygeoinf/symmetric_space/wigner.py" = ["E741"]

[tool.pytest.ini_options]
# The default run excludes `slow`. Those tests are not less important — several
# are the parity checks the design record leans on — but they are the ones
# whose cost is the *point* (an iteration count on a badly-scaled problem, a
# Monte Carlo estimate against its own standard error), so they are worth
# minutes rather than seconds and are worth them occasionally.
#
#     pytest pygeoinf2                 the fast suite
#     pytest pygeoinf2 -m slow         only the expensive ones
#     pytest pygeoinf2 -m ""           everything
addopts = "-m 'not slow'"
markers = [
    "slow: takes tens of seconds or more; excluded from the default run",
]
