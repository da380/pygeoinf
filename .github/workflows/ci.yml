name: CI

# Every push, on any branch: the test suite is not run locally by a git hook,
# so this is where it runs.
on:
  push:
  pull_request:
    branches: [ main ]
  # The slow set (parity checks and Monte Carlo estimates, worth minutes
  # rather than seconds) runs weekly on every platform, and on request.
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  # Linting, formatting and the notebook-output rule, straight from
  # .pre-commit-config.yaml so that the hooks and CI can never disagree about
  # what "clean" means. Runs once on Linux: none of these checks are
  # platform-dependent.
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Cache pre-commit environments
      uses: actions/cache@v6
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

    - name: Install pre-commit
      run: pip install pre-commit

    - name: Run hooks
      env:
        # `no-commit-to-branch` guards local commits; on a CI checkout of main
        # it would fail every run.
        SKIP: no-commit-to-branch
      run: pre-commit run --all-files --show-diff-on-failure --color=always

  build-and-test:
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Poetry
      run: |
        pip install poetry
        poetry config virtualenvs.create false

    - name: Install dependencies
      run: poetry install --with dev --all-extras

    - name: Test with pytest
      run: poetry run pytest --cov=pygeoinf

    - name: Build package
      run: poetry build

  # The slow set, without coverage tracing, which would double its time.
  slow-tests:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install Poetry
      run: |
        pip install poetry
        poetry config virtualenvs.create false

    - name: Install dependencies
      run: poetry install --with dev --all-extras

    - name: Run the slow set
      run: poetry run pytest tests -m slow
